# Trace spec: oak's 22:00Z slot on a mild evening in BufferOnly mode, the unmet-load penalty
# on: a flo.params 003 request, bruce's flo.recommendation 002 with its on-pair at $103/MWh,
# and the flo.previous.run the LTN published once the on-peak slot cleared off.
# Pulled from the production journal (gridworks.messages) at 2026-11-18 23:40Z; the three
# bodies are beside this file, verbatim: oak-flo.params-003.json, oak-flo.recommendation-002.json
# and oak-flo.previous.run-000.json. This file and the expected output below are the vector.
name: 2026-11-18-oak-penalty-on-bid
concern: hub
clauses_exercised: [a request is answered from its own bytes and the plant-shape matrix (hub invariant 2), the reply is complete over prices from the request's ceiling with one path per pair (hub invariant 3), every path is annotated with the store's state and the optimizer's penalties (hub invariant 6), the clearing is a word the LTN publishes and reads back (hub invariant 7), a recommendation for another bidder is dropped]
event: >
  Field window, production. Outdoor 48 F, the store in BufferOnly mode
  at 121/108/104 F with 53.5 kWh of load over the two days. oak's LTN,
  restarted at 21:39Z with the regenerated layout pair (flo.tuning.bruce
  002, UnmetLoadPenaltyEnabled true), built its request for the 22:00Z
  slot at 21:57:56Z with the forecast price at $647/MWh now (the
  distribution peak) and $91 to $103 overnight. bruce at
  optimal-flexibility bccfe41 answered in 8.1 s with two pairs: nothing
  above $103/MWh, and 6.56 kW at or below it. The slot cleared at pair 0
  (off); at 22:00:00Z the LTN published the cleared pair, its path and
  the next slot's price. Thirty seconds before oak's request, hw1.flo's
  recommendation for beech reached oak's LTN, which dropped it as the
  answer to no request of its own.

window:
  start: 2026-11-18T21:57:00Z    # before beech's recommendation and oak's request
  end: 2026-11-18T22:00:10Z      # after the previous.run
time: arrival                    # order and timestamp by the journal's persisted_at
decode: as-sent                  # the service parses flo.params 003 and refuses other versions
senders:
  - hw1.isone.me.versant.keene.oak   # the LTN
  - hw1.flo
bodies_for: [flo.params, flo.recommendation, flo.previous.run]

input:
  - t: 2026-11-18T21:57:24.875Z  # hw1.flo, for another bidder; the LTN hears it and drops it
    created_ms: 1795039044437
    type: flo.recommendation 002
    BidderAlias: hw1.isone.me.versant.keene.beech
    body: not kept; the vector needs only its BidderAlias
  - t: 2026-11-18T21:57:56.596Z  # the one message the service answers
    created_ms: 1795039076527
    type: flo.params 003
    body: oak-flo.params-003.json
    StartUnixS: 1795039200
    Tuning: flo.tuning.bruce 002  # UnmetLoadPenaltyEnabled true at weight 10, ShortCyclePenaltyEnabled false
    SeasonalStorageMode: BufferOnly
    PriceUsdMwhList: 48 values, 91.07 to 654.31, first 647.132
    LoadKwhList: 48 values, 53.5 kWh in all, first 0.21
    steps: 48 of 60 minutes

expected_out:
  - t: 2026-11-18T21:58:05.093Z  # hw1.flo's send; the LTN's record copy follows at 21:58:05.208Z with the same CreatedMs
    created_ms: 1795039084646
    type: flo.recommendation 002
    body: oak-flo.recommendation-002.json
    BidderAlias: hw1.isone.me.versant.keene.oak
    PriceUnit: USDPerMWh
    QuantityUnit: AvgkW
    PqPairs:                     # PriceX1000, QuantityX1000
      - [2000000, 0]
      - [103000, 6562]
    OptimalPathList: 2 flo.optimal.path 000, StartUnixS 1795039200, 48 steps each
    StoreStateList: 2 flo.tank.store.path 000, 9 layers, EmptyStoreWh 155446, FullStoreWh 182153
    PathPenaltiesList: 2 flo.path.penalties.bruce 001, PathCostUsd 3.29 and 6.86, every penalty list all zero
    FloName: bruce
    FloGitCommit: bccfe4189a828740aadd3008699416e0e6c54bde
  - t: 2026-11-18T22:00:07.095Z  # the LTN, not the service: the clearing as a word (hub invariant 7)
    created_ms: 1795039200605
    from: hw1.isone.me.versant.keene.oak
    type: flo.previous.run 000
    body: oak-flo.previous.run-000.json
    ClearedPairIndex: 0
    ClearedPair: [2000000, 0]
    NextSlotPriceX1000: 643692   # the request's PriceUsdMwhList[1]

not_in_window:
  - the routing keys and header Dst of each message; the journal keeps the body and the sender
  - oak's plant-shape transition matrix; replay serves the one the request's plant shape hashes to
  - a refusal of any kind
  - the market's clearing message itself; only the LTN's record of it is here
  - beech's own request; it went to the service before the window opened
tolerance: the reply before GWFLO_REPLY_DEADLINE_S from the request's arrival; PqPairs, OptimalPathList, StoreStateList and PathPenaltiesList exact; CreatedMs free
