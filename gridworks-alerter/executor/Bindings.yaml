# Bindings: pointers into the code and nowhere else. A symbol is
# qualified with its File; a test binds a Clause by its test name; a
# setting binds a Clause to a Settings Key; a cli binds a Concern to a
# command. Clause is "<Number><Label>" within Concern, blank on a cli row.
# File is relative to the repo root and is what the reconcile reads.
table: Bindings
schema:
  - name: Concern
    kind: relationship
    to: Concerns.Name
    blank: hub
  - name: Clause
    kind: relationship
    to: Clauses.Number & Clauses.Label
  - name: Kind
    kind: raw
    values: [symbol, test, setting, cli]
  - name: TargetName
    kind: raw
  - name: File
    kind: raw
  - name: Resolves
    kind: calculated
    formula: IF(Kind="setting", COUNTIF(Settings.Key, TargetName) > 0, SymbolInFile(TargetName, File))
