# Vectors: one fixture per clause, its kind set by the clause's. A row
# with no Path is the work list ("Finding the traces"). An example of a
# word is sema's by reference, Path <word>/<version>. Paths are relative
# to this folder.
table: Vectors
schema:
  - name: Concern
    kind: relationship
    to: Concerns.Name
    blank: hub
  - name: Idx
    kind: raw
  - name: Kind
    kind: raw
    values: [example, counterexample, trace]
  - name: Path
    kind: raw
  - name: Clause
    kind: relationship
    to: Clauses.Number & Clauses.Label
  - name: Exists
    kind: calculated
    formula: IF(Kind="example", WordHasExample(Path), FileExists(Path & "/trace.yaml"))
