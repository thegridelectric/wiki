# Vectors: one fixture per clause, its kind set by the clause's. A row
# with no Path is the work list ("Finding the traces"). An example of a
# word is sema's by reference, Path <word>/<version>. Paths are relative
# to this folder.
table: Vectors
schema:
  - name: Concern
    kind: relationship
    to: Concerns.Name
    blank: hub
  - name: Idx
    kind: raw
  - name: Kind
    kind: raw
    values: [example, counterexample, trace]
  - name: Path
    kind: raw
  - name: Clause
    kind: relationship
    to: Clauses.Number & Clauses.Label
  - name: Exists
    kind: calculated
    formula: IF(Kind="example", WordHasExample(Path), FileExists(Path & "/trace.yaml"))
data:
  - {Concern: "", Idx: 1, Kind: example, Clause: "1a", Path: "latest.price/001"}
  - {Concern: "", Idx: 2, Kind: example, Clause: "1a", Path: "glitch/000"}
  - {Concern: "", Idx: 3, Kind: trace, Clause: "1b", Path: "traces/2026-11-25-dev-cold-failure-and-inbox"}
  - {Concern: "", Idx: 4, Kind: trace, Clause: "2a", Path: "traces/2026-11-15-keene-first-hour"}
