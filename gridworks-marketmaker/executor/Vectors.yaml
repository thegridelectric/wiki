  - {Concern: gate, Idx: 2, Kind: trace, Clause: "1b", Path: "traces/2026-11-15-keene-first-hour"}
  - {Concern: gate, Idx: 3, Kind: trace, Clause: "2a", Path: "traces/2026-11-15-keene-first-hour"}
  - {Concern: gate, Idx: 4, Kind: counterexample, Clause: "2b", Path: "traces/2026-11-11-keene-stale-price"}
  - {Concern: gate, Idx: 5, Kind: trace, Clause: "3a", Path: "traces/2026-11-15-keene-first-hour"}
  - {Concern: gate, Idx: 6, Kind: counterexample, Clause: "3b", Path: "traces/2026-11-11-keene-stale-price"}
